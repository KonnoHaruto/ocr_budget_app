name: ocr_budget_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.15.0
  receipt_recognition: ^0.1.0
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: 2.6.1
  firebase_core: ^3.15.1
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.0.0
  path_provider: ^2.1.1
  riverpod_annotation: ^2.6.1
  freezed: 2.4.6
  go_router: ^16.0.0
  image_picker: ^1.1.2
  animations: ^2.0.11
  freezed_annotation: 2.4.1
  json_annotation: ^4.9.0
  permission_handler: ^12.0.1
  dio: ^5.8.0+1
  shared_preferences: ^2.2.2
  introduction_screen: ^3.1.14
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: 2.6.1
  build_runner: 2.5.4
  json_serializable: 6.8.0
  hive_generator: 2.0.1
  custom_lint: 0.6.4

flutter:

  uses-material-design: true
  
  assets:
    - assets/images/

analyzer:
  plugins:
    - custom_lint

  errors:
    invalid_annotation_target: ignore

flutter_native_splash:
  color: "#000000"  # Black background to match app theme
  color_dark: "#000000"  # Dark mode background
  ios_content_mode: center
  android_gravity: center
  fullscreen: true